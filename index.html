<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightcord Background</title>
    <link rel="stylesheet" href="laptop_background.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id = "clockcontainer">
        <h1 id = "laptoptime"></h1>
        <h2 id = "nightcordtime"></h2>
        <span id = "day"></span>
    </div>
    <video autoplay muted loop playsinline id = "background" src = "https://archive.org/download/main_loop/main_loop.mp4" type = "video/mp4">
    </video>
    <audio loop id = "aud" src= "https://archive.org/download/untitled_20260907/Untitled.mp3" type = "audio/mpeg">
    </audio>
    <script src = "laptop_background.js" defer></script>
</body>
</html>
